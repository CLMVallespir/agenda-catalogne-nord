<!DOCTYPE html>
<html lang="ca" data-tema="clar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- La CSP: només s'executen els scripts d'aquest mateix lloc (cap codi
       en línia, cap enllaç javascript:), i la pàgina només parla amb
       GitHub i Cloudinary. Ha d'anar abans de qualsevol script. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; connect-src https://api.github.com https://api.cloudinary.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Cua de revisió — Què fas?</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- ============================================================
       CURADOR — la cua de revisió
       Segona pàgina estàtica del repositori. Mostra cada fila de
       pendents.json amb el cartell al costat del text, deixa
       corregir qualsevol camp, i valida amb dos botons: Publica i
       Rebutja.

       Excepció: nota_curador no és un camp editable. Si la fila en
       porta, surt a dalt com a avís groc — és el que un agent de
       darrere ha deixat dit sobre la fila, i el curador no el toca.

       Publica: posa estat = "publicat", afegeix la fila a
                events.json i, a pendents.json, la SUBSTITUEIX a la
                mateixa posició per la fila publicada (amb la
                nota_curador intacta). No la treu: la nota porta el
                tag [ADT66 id: …], i sense ell la sincronització
                tornaria a encuar l'oferta publicada. Canviat l'1
                d'octubre de 2026.
       Rebutja: NO treu la fila. Hi posa estat = "rebutjat" i la
                deixa on és. pendents.json és la memòria de rebuig
                del projecte: la fila rebutjada hi queda perquè una
                futura sincronització automàtica no la torni a
                oferir. La cua només pinta les files pendents.

       El testimoni de GitHub NO viu mai aquí dins. S'enganxa al
       camp de dalt, viu en una variable durant la sessió i mor en
       tancar la pestanya. Cap emmagatzematge, cap login.

       Sense testimoni, la pàgina és només de lectura.

       Aquesta pàgina porta el seu propi estil. El codi és a tres
       fitxers, que es carreguen en aquest ordre al final del cos:
       curador-cua.js (les peces que canvien l'estat de la cua),
       url-segura.js (quines adreces poden anar a un enllaç) i
       curador.js (tota la resta). Cap codi en línia: la CSP de dalt
       no el deixaria executar. Node prova la pàgina sencera
       (proves/curador-cua.test.js).
       ============================================================ -->

  <style>
  /* --------------------------------------------------------------------
     Tipografies pròpies, les mateixes del web públic.
  --------------------------------------------------------------------- */
  @font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/fraunces-700.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/montserrat-400.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/montserrat-600.woff2') format('woff2'); }

  /* --------------------------------------------------------------------
     Colors i tipus. Un sol tema (el clar): l'únic usuari n'és el curador.
  --------------------------------------------------------------------- */
  :root {
    --vermell: #b5121b;
    --or: #fcdd09;

    --fons: #ffffff;
    --fons-targeta: #ffffff;
    --tinta: #1a1a1a;
    --tinta-suau: #6f6862;
    --vora: #e7e4df;
    --accent: var(--vermell);
    --banderola-fons: #1a1a1a;
    --banderola-text: #ffffff;
    --placeholder-fons: #f5eccf;
    --placeholder-icona: #7a5f12;

    --tipo-titol: 'Fraunces', Georgia, 'Times New Roman', serif;
    --tipo-ui: 'Montserrat', system-ui, 'Segoe UI', Arial, sans-serif;
    --tipo-serif: Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fons);
    color: var(--tinta);
    font-family: var(--tipo-ui);
    line-height: 1.5;
  }

  .contingut { max-width: 900px; margin: 0 auto; padding: 0 1rem; }

  /* --------------------------------------------------------------------
     Capçalera i barra del testimoni.
  --------------------------------------------------------------------- */
  .capcalera {
    padding: 1.4rem 0 1.3rem;
    border-bottom: 1px solid var(--vora);
  }
  .capcalera h1 {
    margin: 0;
    font-family: var(--tipo-titol);
    font-weight: 700;
    font-size: 1.6rem;
  }
  .capcalera h1::before {
    content: "";
    display: inline-block;
    width: 0.55rem;
    height: 0.55rem;
    margin-right: 0.5rem;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: 0.12em;
  }
  .capcalera .subtitol {
    margin: 0.45rem 0 0;
    font-family: var(--tipo-serif);
    font-style: italic;
    font-size: 0.95rem;
    color: var(--tinta-suau);
  }
  .capcalera .subtitol a { color: inherit; }

  .barra-testimoni {
    border-bottom: 1px solid var(--vora);
    padding: 0.85rem 0;
  }
  .barra-interior { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

  .camp-testimoni {
    font-family: var(--tipo-ui);
    font-size: 0.8rem;
    flex: 1 1 18rem;
    min-width: 0;
    padding: 0.35rem 0.5rem;
    border: 1.5px solid var(--vora);
    border-radius: 6px;
    background: var(--fons-targeta);
    color: var(--tinta);
  }

  /* --------------------------------------------------------------------
     Botons. Mateixa geometria que els del web públic.
  --------------------------------------------------------------------- */
  .boto {
    font-family: var(--tipo-ui);
    font-weight: 600;
    font-size: 0.8rem;
    padding: 0.35rem 0.9rem;
    border: 1.5px solid var(--tinta);
    border-radius: 999px;
    background: transparent;
    color: var(--tinta);
    cursor: pointer;
    line-height: 1.2;
  }
  .boto:hover { background: var(--vora); }
  .boto:disabled { opacity: 0.4; cursor: not-allowed; }
  .boto:disabled:hover { background: transparent; }

  .boto-publica { background: var(--tinta); color: var(--fons); }
  .boto-publica:hover { background: transparent; color: var(--tinta); }
  .boto-publica:disabled:hover { background: var(--tinta); color: var(--fons); }

  .boto-rebutja { border-color: var(--tinta-suau); color: var(--tinta-suau); }

  .boto:focus-visible,
  .camp-testimoni:focus-visible,
  .fitxa input:focus-visible,
  .fitxa select:focus-visible,
  .fitxa textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --------------------------------------------------------------------
     Missatges d'estat: un de global, un per fitxa.
  --------------------------------------------------------------------- */
  .avis {
    font-family: var(--tipo-ui);
    font-size: 0.8rem;
    padding: 0.45rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--vora);
    background: var(--fons-targeta);
    color: var(--tinta-suau);
  }
  .avis.error { border-color: var(--accent); color: var(--accent); }
  .avis.fet { border-color: var(--tinta); color: var(--tinta); }

  .missatge-estat {
    font-family: var(--tipo-serif);
    text-align: center;
    color: var(--tinta-suau);
    padding: 3rem 1rem;
    font-style: italic;
  }

  /* Etiqueta que només existeix per als lectors de pantalla. */
  .visualment-amagat {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .recompte {
    font-family: var(--tipo-ui);
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--tinta-suau);
    margin: 1.5rem 0 0.7rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--vora);
  }

  /* --------------------------------------------------------------------
     La fitxa d'un esdeveniment pendent: cartell a l'esquerra, camps
     a la dreta. La decisió del curador és en bona part visual, així
     que el cartell hi surt gran.
  --------------------------------------------------------------------- */
  .fitxa {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    background: var(--fons-targeta);
    border: 1px solid var(--vora);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 0.85rem;
  }
  .fitxa.ocupada { opacity: 0.5; }

  .cartell {
    position: relative;
    flex: 0 0 auto;
    width: 200px;
    height: 200px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--placeholder-fons);
    box-shadow: 0 2px 7px rgba(0, 0, 0, 0.18);
  }
  .cartell a { display: block; width: 100%; height: 100%; cursor: zoom-in; }
  .cartell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cartell.sense-cartell { display: flex; align-items: center; justify-content: center; }
  .cartell .icona { display: inline-flex; color: var(--placeholder-icona); }
  .cartell .icona svg { width: 56px; height: 56px; }

  .cos { flex: 1; min-width: 0; }

  .graella { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
  .graella .ample { grid-column: 1 / -1; }

  .camp { display: flex; flex-direction: column; }
  /* L'entrada va dins de l'etiqueta, per no haver d'inventar cap id. */
  .camp label {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    font-family: var(--tipo-ui);
    font-weight: 600;
    font-size: 0.62rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--tinta-suau);
  }
  .fitxa input,
  .fitxa select,
  .fitxa textarea {
    font-family: var(--tipo-ui);
    font-size: 0.82rem;
    width: 100%;
    padding: 0.3rem 0.45rem;
    border: 1.5px solid var(--vora);
    border-radius: 6px;
    background: var(--fons-targeta);
    color: var(--tinta);
    color-scheme: light;
    /* L'etiqueta que els conté va en versaletes: no ho han d'heretar. */
    text-transform: none;
    letter-spacing: normal;
    font-weight: 400;
  }
  .fitxa textarea { resize: vertical; min-height: 4.5rem; line-height: 1.45; }
  .fitxa input:disabled,
  .fitxa select:disabled,
  .fitxa textarea:disabled { background: var(--vora); color: var(--tinta-suau); }

  /* El títol és el camp que més sovint cal tocar: se li dóna pes. */
  .camp-titol input { font-family: var(--tipo-titol); font-weight: 700; font-size: 1rem; }

  /* --------------------------------------------------------------------
     L'avís de nota_curador. No és un camp: és el que un agent de darrere
     ha deixat dit sobre aquesta fila. Va en groc i amb franja a
     l'esquerra perquè no es pugui confondre mai amb una casella
     editable, que aquí totes són blanques i amb vora grisa.
  --------------------------------------------------------------------- */
  .nota-curador {
    margin: 0 0 0.7rem;
    padding: 0.45rem 0.7rem;
    border: 1px solid #e0c94a;
    border-left: 5px solid var(--or);
    border-radius: 6px;
    background: var(--placeholder-fons);
    color: var(--tinta);
    font-family: var(--tipo-ui);
    font-size: 0.8rem;
    line-height: 1.4;
  }
  .nota-curador .etiqueta {
    display: block;
    font-weight: 600;
    font-size: 0.62rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--placeholder-icona);
    margin-bottom: 0.15rem;
  }
  /* La nota pot portar salts de línia: s'han de veure tal com són. */
  .nota-curador .text { white-space: pre-wrap; }

  .identificador {
    font-family: var(--tipo-serif);
    font-style: italic;
    font-size: 0.75rem;
    color: var(--tinta-suau);
    margin: 0.5rem 0 0;
    word-break: break-all;
  }

  .accions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.7rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--vora);
  }

  /* En pantalla estreta el cartell passa a dalt i els camps a una columna. */
  @media (max-width: 700px) {
    .fitxa { flex-direction: column; }
    .cartell { width: 100%; height: 220px; }
    .graella { grid-template-columns: minmax(0, 1fr); }
  }
  </style>
</head>
<body>

  <header class="capcalera">
    <div class="contingut">
      <h1>Cua de revisió</h1>
      <p class="subtitol">
        Els actes que esperen validació · <a href="index.html">torna a l’agenda</a>
      </p>
    </div>
  </header>

  <section class="barra-testimoni" aria-label="Testimoni de GitHub">
    <div class="contingut barra-interior">
      <label class="visualment-amagat" for="camp-testimoni">Testimoni de GitHub</label>
      <input type="password" id="camp-testimoni" class="camp-testimoni"
             placeholder="Enganxa aquí el testimoni de GitHub" autocomplete="off" spellcheck="false">
      <button type="button" id="boto-testimoni" class="boto">Activa l’escriptura</button>
      <button type="button" id="boto-recarrega" class="boto">Torna a carregar la cua</button>
      <p id="avis-global" class="avis">Només lectura: sense testimoni no es pot publicar ni rebutjar res.</p>
    </div>
  </section>

  <main class="contingut">
    <p id="recompte" class="recompte" hidden></p>
    <p id="missatge-estat" class="missatge-estat">Carregant la cua…</p>
    <div id="llista-pendents"></div>
  </main>

<script src="curador-cua.js"></script>
<script src="url-segura.js"></script>
<script src="curador.js"></script>
</body>
</html>
